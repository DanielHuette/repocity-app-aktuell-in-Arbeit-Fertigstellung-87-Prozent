name: Bau

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webseite:
    name: Webseite bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten holen
        working-directory: webseite
        run: npm install --no-audit --no-fund
      - name: Bauen
        working-directory: webseite
        run: npx astro build

  kern:
    name: Kern prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge holen
        run: python -m pip install --upgrade pip ruff
      - name: Syntax aller Python-Dateien
        run: python -m compileall -q kern agenten
      - name: Stil
        run: ruff check kern agenten --output-format=github
        continue-on-error: true

  geheimnisse:
    name: Keine Schlüssel im Diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Suchen
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY)' \
               --exclude-dir=.git --exclude-dir=node_modules . | grep -v 'pruefung.mjs'; then
            echo "::error::Etwas sieht nach einem Schluessel aus."
            exit 1
          fi
          echo "Nichts gefunden."
